spring:
  application:
    name: fishing-backend
  profiles:
    # ./mvnw spring-boot:run без параметров запускается в dev; на сервере SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # схему создаёт только Flyway, Hibernate лишь проверяет, что сущности ей соответствуют
      ddl-auto: validate
    # не держим соединение с БД открытым до конца HTTP-запроса: все запросы к БД делает сервис
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  storage:
    # путь для сохранения фото, по умолчанию ./storage
    path: ${STORAGE_PATH:./storage}
  cors:
    # не секрет, поэтому есть значение по умолчанию: тесты и запуск без .env работают
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    # секрет только из окружения (CLAUDE.md, раздел 7), без значения по умолчанию; не короче 32 символов
    secret: ${JWT_SECRET}
    # PWA часто офлайн, поэтому по умолчанию токен живёт 7 дней
    ttl-hours: ${JWT_TTL_HOURS:168}


